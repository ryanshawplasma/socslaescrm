<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#56C0F5"/>
      <stop offset="1" stop-color="#0270C4"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#sky)"/>
  <!-- ears -->
  <circle cx="8.2"  cy="14.4" r="3.6" fill="#fff"/>
  <circle cx="23.8" cy="14.4" r="3.6" fill="#fff"/>
  <!-- head -->
  <ellipse cx="16" cy="16.2" rx="7.1" ry="7.4" fill="#fff"/>
  <!-- muzzle -->
  <ellipse cx="16" cy="19.4" rx="4.5" ry="3.4" fill="#DCEEFB"/>
  <!-- eyes -->
  <circle cx="13.5" cy="14.2" r="1.25" fill="#0B2338"/>
  <circle cx="18.5" cy="14.2" r="1.25" fill="#0B2338"/>
  <!-- smile -->
  <path d="M13.9 19.4c.6.8 1.3 1.2 2.1 1.2s1.5-.4 2.1-1.2" fill="none" stroke="#0B2338" stroke-width="1.15" stroke-linecap="round"/>
</svg>
