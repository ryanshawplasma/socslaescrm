<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#56C0F5"/>
      <stop offset="1" stop-color="#0270C4"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#sky)"/>
  <!-- ascending growth bars — reads as sales momentum at any size -->
  <rect x="7.4"  y="18.2" width="4"   height="7.4"  rx="2" fill="#fff" opacity=".55"/>
  <rect x="14"   y="13.6" width="4"   height="12"   rx="2" fill="#fff" opacity=".78"/>
  <rect x="20.6" y="8.2"  width="4"   height="17.4" rx="2" fill="#fff"/>
  <!-- rising tick above the tallest bar -->
  <path d="M20.4 6.6 L24.8 6.6 L24.8 11" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
</svg>
