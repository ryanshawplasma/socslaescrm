<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#56C0F5"/>
      <stop offset="1" stop-color="#0270C4"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#sky)"/>
  <!-- ears (bigger + inner tint) -->
  <circle cx="7.6"  cy="13.8" r="4.2" fill="#fff"/>
  <circle cx="24.4" cy="13.8" r="4.2" fill="#fff"/>
  <circle cx="7.6"  cy="13.8" r="2"   fill="#BFE3FA"/>
  <circle cx="24.4" cy="13.8" r="2"   fill="#BFE3FA"/>
  <!-- round head -->
  <ellipse cx="16" cy="17" rx="7.7" ry="7.6" fill="#fff"/>
  <!-- little hair tuft -->
  <path d="M14.4 10.1c.35-1.85 1.35-2.85 2.55-2.75-.5.42-.72.95-.62 1.55.72-.78 1.62-1 2.5-.62-1.02.5-1.5 1.28-1.5 2.28z" fill="#fff"/>
  <!-- muzzle -->
  <ellipse cx="16" cy="20.5" rx="5" ry="3.6" fill="#DCEEFB"/>
  <!-- rosy cheeks -->
  <circle cx="9.9"  cy="19.2" r="1.35" fill="#7FC9F2" opacity=".55"/>
  <circle cx="22.1" cy="19.2" r="1.35" fill="#7FC9F2" opacity=".55"/>
  <!-- big eyes + highlights -->
  <circle cx="13.2" cy="15.4" r="1.95" fill="#0B2338"/>
  <circle cx="18.8" cy="15.4" r="1.95" fill="#0B2338"/>
  <circle cx="12.55" cy="14.75" r="0.62" fill="#fff"/>
  <circle cx="18.15" cy="14.75" r="0.62" fill="#fff"/>
  <!-- tiny nose + gentle smile -->
  <ellipse cx="16" cy="19.1" rx="0.72" ry="0.55" fill="#0B2338" opacity=".75"/>
  <path d="M14.5 20.9c.45.6 .95.88 1.5.88s1.05-.28 1.5-.88" fill="none" stroke="#0B2338" stroke-width="1.05" stroke-linecap="round"/>
</svg>
